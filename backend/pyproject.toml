[project]
name = "proofsettle-backend"
version = "0.1.0"
description = "ProofSettle API: agreements, evidence, settlement and audit"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "solders>=0.29.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
