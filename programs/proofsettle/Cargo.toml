[package]
name = "proofsettle"
version = "0.1.0"
description = "ProofSettle: on-chain agreement, evidence and settlement record"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "proofsettle"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# Keep this in sync with your installed anchor-cli (`avm install 1.2.1 && avm use 1.2.1`)
anchor-lang = "1.2.1"
