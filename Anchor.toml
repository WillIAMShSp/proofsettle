[toolchain]
anchor_version = "1.2.1"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
proofsettle = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[hooks]
post-build = "node scripts/sync-idl.mjs"

# The program tests keep their own package.json in tests/ so the web app's
# package.json and bun.lock (synced with Lovable) stay untouched.
[scripts]
test = "cd tests && npx ts-mocha -p ./tsconfig.json -t 1000000 proofsettle.ts"
