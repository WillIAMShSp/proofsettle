[toolchain]
anchor_version = "1.2.1"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
proofsettle = "FNp1BRdeBxrEqrW2Uyx2VicGtJqpMDGj2XUorkApuabm"

[programs.devnet]
proofsettle = "FNp1BRdeBxrEqrW2Uyx2VicGtJqpMDGj2XUorkApuabm"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

# The program tests keep their own package.json in tests/ so the web app's
# package.json and lockfiles (synced with Lovable) stay untouched. Run from the
# workspace root: anchor.workspace reads ./Anchor.toml.
[scripts]
test = "tests/node_modules/.bin/ts-mocha -p tests/tsconfig.json -t 1000000 tests/proofsettle.ts"

# Hooks and scripts run through `bash -c`; on Windows put Git's bash first on PATH.
[hooks]
post_build = "node scripts/sync-idl.mjs"
